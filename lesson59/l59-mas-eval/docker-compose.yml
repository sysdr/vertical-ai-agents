version: "3.9"
services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      bash -c "pip install -r requirements.txt -q &&
               python -m uvicorn api.main:app --host 0.0.0.0 --port 8059 --reload"
    ports:
      - "8059:8059"
    environment:
      PYTHONPATH: /app
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "npm install -s && npm start"
    ports:
      - "3059:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8059
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped
