version: "3.9"
services:
  backend:
    build: .
    ports:
      - "8069:8069"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8069
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3069:3069"
    command: sh -c "npm install --silent && npm start"
    environment:
      - PORT=3069
      - BROWSER=none
    depends_on:
      - backend
