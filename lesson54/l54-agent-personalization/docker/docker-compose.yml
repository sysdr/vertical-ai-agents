version: "3.9"
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8054:8054"
    volumes:
      - ../data:/app/data
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PRIVACY_MODE=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8054/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3054:80"
    depends_on:
      backend:
        condition: service_healthy
