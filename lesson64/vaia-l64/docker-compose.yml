# L64 – Local VAIA dev stack
# Mirrors the K8s service topology for fast local iteration.
# Usage: docker compose up          (start everything)
#        docker compose run --rm test  (run pytest in-container)

version: "3.9"

services:

  agent:
    build:
      context: .
      target: runtime
    image: vaia-agent:local
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      ENVIRONMENT: development
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - vaia-net

  # ── Test service (assignment: run pytest in-container) ────────────────────
  test:
    build:
      context: .
      target: dev
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      chromadb:
        condition: service_healthy
    networks:
      - vaia-net
    profiles:
      - test   # only starts when: docker compose --profile test run test

  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    environment:
      CHROMA_SERVER_HTTP_PORT: "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - vaia-net

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - vaia-net

  # ── Prometheus (L65 prep) ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - vaia-net
    depends_on:
      - agent

volumes:
  chroma-data:
  redis-data:

networks:
  vaia-net:
    driver: bridge
