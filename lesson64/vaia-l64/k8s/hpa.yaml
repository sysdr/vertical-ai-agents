# HPA stub – L65 will trigger this via locust load test
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vaia-agent
  namespace: vaia-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaia-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60     # Low threshold: L65 locust will trigger this
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
