apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaia-agent-ingress
  namespace: vaia-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: vaia-agent.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaia-agent-service
                port:
                  number: 8000
  # Uncomment to enable TLS:
  # tls:
  #   - hosts:
  #       - vaia-agent.your-domain.com
  #     secretName: vaia-agent-tls
