apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaia-agent
  namespace: vaia-prod
  labels:
    app: vaia-agent
    version: "0.64.0"
    tier: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vaia-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0      # Zero-downtime: capacity never drops
  template:
    metadata:
      labels:
        app: vaia-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: vaia-agent
          image: ghcr.io/your-org/vaia-agent:latest   # CD pipeline injects sha tag
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: vaia-agent-config
            - secretRef:
                name: vaia-agent-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # ── Probes: distinct live vs ready semantics ──────────────────────
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 15    # ChromaDB + model warm-up
            periodSeconds: 5
            failureThreshold: 3
          # ── Startup probe: one-time longer grace period ───────────────────
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 12       # 12 × 5s = 60s max startup window
            periodSeconds: 5
