# =============================================================================
# L64 – CD Pipeline
# Prerequisite: L63 ci.yml must pass before any Docker steps begin.
# Flow: ci → build-and-scan → push → deploy (main branch only)
# =============================================================================
name: CD Pipeline

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/vaia-agent

jobs:
  # ── Job 1: Re-run L63 CI tests ──────────────────────────────────────────────
  ci:
    name: L63 CI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run L63 test suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest tests/ -v --tb=short --cov=src --cov-fail-under=70

  # ── Job 2: Build & Scan ────────────────────────────────────────────────────
  build-and-scan:
    name: Build Image & Trivy Scan
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      security-events: write   # for sarif upload

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build image (runtime stage only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false           # scan before pushing
          load: true            # load into local daemon for scanning
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy CVE scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          exit-code: "1"                    # HARD GATE: fail on CRITICAL/HIGH
          severity: "CRITICAL,HIGH"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push image after clean scan
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # ── Job 3: Deploy to K8s (main branch only) ────────────────────────────────
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config

      - name: Update deployment image tag
        run: |
          SHA_TAG="sha-${{ github.sha }}"
          # Patch the deployment image in-place (GitOps: also commit to manifest repo)
          kubectl set image deployment/vaia-agent \
            vaia-agent=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA_TAG} \
            -n vaia-prod

      - name: Wait for rollout
        run: kubectl rollout status deployment/vaia-agent -n vaia-prod --timeout=5m

      - name: Smoke test
        run: |
          POD=$(kubectl get pod -n vaia-prod -l app=vaia-agent \
                -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n vaia-prod ${POD} -- \
            curl -sf http://localhost:8000/health/ready
