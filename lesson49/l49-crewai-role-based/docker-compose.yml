services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8049:8049"
    environment:
      - GEMINI_API_KEY=
      - BACKEND_PORT=8049
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8049/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3049:3049"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8049
    depends_on:
      backend:
        condition: service_healthy
