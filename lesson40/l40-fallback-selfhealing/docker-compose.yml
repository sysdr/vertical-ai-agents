version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - redis
    networks:
      - l40-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - l40-network

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm start"
    networks:
      - l40-network

networks:
  l40-network:
    driver: bridge
