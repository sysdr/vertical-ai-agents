<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e1f5fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b3e5fc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow2">
      <feDropShadow dx="2" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#01579b">
    L23: Hybrid Search Workflow
  </text>
  
  <!-- Step 1: Query Input -->
  <ellipse cx="600" cy="100" rx="160" ry="50" fill="#b3e5fc" stroke="#0277bd" stroke-width="3" filter="url(#shadow2)"/>
  <text x="600" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#01579b">User Query</text>
  <text x="600" y="118" font-size="12" text-anchor="middle" fill="#0277bd">+ Metadata Filters</text>
  
  <!-- Step 2: Embedding Generation -->
  <rect x="470" y="170" width="260" height="70" rx="12" fill="url(#flow1)" stroke="#0288d1" stroke-width="2" filter="url(#shadow2)"/>
  <text x="600" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#01579b">Generate Embedding</text>
  <text x="600" y="220" font-size="11" text-anchor="middle" fill="#0277bd">Gemini API: text-embedding-004</text>
  
  <!-- Branch to Parallel Searches -->
  <line x1="600" y1="240" x2="600" y2="280" stroke="#666" stroke-width="3"/>
  <line x1="600" y1="280" x2="300" y2="330" stroke="#666" stroke-width="3"/>
  <line x1="600" y1="280" x2="900" y2="330" stroke="#666" stroke-width="3"/>
  
  <!-- Step 3a: Vector Search -->
  <rect x="120" y="330" width="360" height="90" rx="12" fill="#c8e6c9" stroke="#388e3c" stroke-width="2" filter="url(#shadow2)"/>
  <text x="300" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#1b5e20">Vector Search</text>
  <text x="300" y="380" font-size="11" text-anchor="middle" fill="#2e7d32">Query embedding vs document embeddings</text>
  <text x="300" y="395" font-size="11" text-anchor="middle" fill="#2e7d32">Cosine similarity ranking</text>
  <text x="300" y="410" font-size="11" text-anchor="middle" fill="#2e7d32">→ Top 20 semantic matches</text>
  
  <!-- Step 3b: Keyword Search -->
  <rect x="720" y="330" width="360" height="90" rx="12" fill="#fff9c4" stroke="#f57f17" stroke-width="2" filter="url(#shadow2)"/>
  <text x="900" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#f57f00">Keyword Search (BM25)</text>
  <text x="900" y="380" font-size="11" text-anchor="middle" fill="#f57f00">Full-text query matching</text>
  <text x="900" y="395" font-size="11" text-anchor="middle" fill="#f57f00">Term frequency scoring</text>
  <text x="900" y="410" font-size="11" text-anchor="middle" fill="#f57f00">→ Top 20 lexical matches</text>
  
  <!-- Metadata Filter Note -->
  <rect x="510" y="290" width="180" height="30" rx="8" fill="#ffecb3" stroke="#ff6f00" stroke-width="2"/>
  <text x="600" y="310" font-size="11" text-anchor="middle" fill="#e65100">Filters applied to both</text>
  
  <!-- Convergence to RRF -->
  <line x1="300" y1="420" x2="600" y2="480" stroke="#666" stroke-width="3"/>
  <line x1="900" y1="420" x2="600" y2="480" stroke="#666" stroke-width="3"/>
  
  <!-- Step 4: RRF Fusion -->
  <rect x="420" y="480" width="360" height="90" rx="12" fill="#e1bee7" stroke="#7b1fa2" stroke-width="2" filter="url(#shadow2)"/>
  <text x="600" y="510" font-size="14" font-weight="bold" text-anchor="middle" fill="#4a148c">RRF Score Fusion</text>
  <text x="600" y="530" font-size="11" text-anchor="middle" fill="#6a1b9a">score = Σ(1 / (rank_i + 60))</text>
  <text x="600" y="545" font-size="11" text-anchor="middle" fill="#6a1b9a">Merge vector + keyword rankings</text>
  <text x="600" y="560" font-size="11" text-anchor="middle" fill="#6a1b9a">→ Unified top-K results</text>
  
  <!-- Step 5: Reranking -->
  <rect x="420" y="600" width="360" height="80" rx="12" fill="#ffccbc" stroke="#d84315" stroke-width="2" filter="url(#shadow2)"/>
  <text x="600" y="630" font-size="14" font-weight="bold" text-anchor="middle" fill="#bf360c">Cross-Encoder Reranking</text>
  <text x="600" y="650" font-size="11" text-anchor="middle" fill="#d84315">L22: ms-marco-MiniLM-L-6-v2</text>
  <text x="600" y="665" font-size="11" text-anchor="middle" fill="#d84315">→ Final top-5 results</text>
  
  <!-- Step 6: Return Results -->
  <ellipse cx="600" cy="730" rx="160" ry="50" fill="#c5e1a5" stroke="#558b2f" stroke-width="3" filter="url(#shadow2)"/>
  <text x="600" y="730" font-size="15" font-weight="bold" text-anchor="middle" fill="#33691e">Ranked Results</text>
  <text x="600" y="748" font-size="12" text-anchor="middle" fill="#558b2f">with rerank scores</text>
  
  <!-- Arrows -->
  <path d="M 600 150 L 600 170" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 600 570 L 600 600" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  <path d="M 600 680 L 600 680" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
  
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <polygon points="0 0, 12 6, 0 12" fill="#666"/>
    </marker>
  </defs>
</svg>
