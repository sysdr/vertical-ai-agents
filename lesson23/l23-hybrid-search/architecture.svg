<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="500" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#1976d2">
    L23: Hybrid Search Architecture
  </text>
  
  <!-- User Layer -->
  <rect x="50" y="80" width="900" height="100" rx="15" fill="url(#grad1)" filter="url(#shadow)"/>
  <text x="500" y="110" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d47a1">User Interface Layer</text>
  <rect x="100" y="125" width="250" height="40" rx="8" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="225" y="150" font-size="14" text-anchor="middle" fill="#0d47a1">React Search UI</text>
  <rect x="400" y="125" width="250" height="40" rx="8" fill="#90caf9" stroke="#1976d2" stroke-width="2"/>
  <text x="525" y="150" font-size="14" text-anchor="middle" fill="#0d47a1">Filter Controls</text>
  
  <!-- API Layer -->
  <rect x="50" y="220" width="900" height="100" rx="15" fill="#fff3e0" filter="url(#shadow)"/>
  <text x="500" y="250" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">API Layer</text>
  <rect x="250" y="265" width="500" height="40" rx="8" fill="#ffcc80" stroke="#f57c00" stroke-width="2"/>
  <text x="500" y="290" font-size="14" text-anchor="middle" fill="#e65100">FastAPI Backend (/search endpoint)</text>
  
  <!-- Hybrid Search Engine -->
  <rect x="50" y="360" width="900" height="140" rx="15" fill="#e8f5e9" filter="url(#shadow)"/>
  <text x="500" y="390" font-size="16" font-weight="bold" text-anchor="middle" fill="#1b5e20">Hybrid Search Engine</text>
  
  <rect x="100" y="410" width="180" height="70" rx="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="190" y="435" font-size="13" text-anchor="middle" fill="#1b5e20">Vector Search</text>
  <text x="190" y="455" font-size="11" text-anchor="middle" fill="#2e7d32">(Embeddings)</text>
  <text x="190" y="470" font-size="11" text-anchor="middle" fill="#2e7d32">Gemini + ChromaDB</text>
  
  <rect x="320" y="410" width="180" height="70" rx="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="410" y="435" font-size="13" text-anchor="middle" fill="#1b5e20">Keyword Search</text>
  <text x="410" y="455" font-size="11" text-anchor="middle" fill="#2e7d32">(BM25)</text>
  <text x="410" y="470" font-size="11" text-anchor="middle" fill="#2e7d32">Full-text Index</text>
  
  <rect x="540" y="410" width="180" height="70" rx="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="630" y="435" font-size="13" text-anchor="middle" fill="#1b5e20">RRF Fusion</text>
  <text x="630" y="455" font-size="11" text-anchor="middle" fill="#2e7d32">Score: 1/(rank+k)</text>
  <text x="630" y="470" font-size="11" text-anchor="middle" fill="#2e7d32">Merge Results</text>
  
  <rect x="760" y="410" width="180" height="70" rx="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="2"/>
  <text x="850" y="435" font-size="13" text-anchor="middle" fill="#1b5e20">Reranker (L22)</text>
  <text x="850" y="455" font-size="11" text-anchor="middle" fill="#2e7d32">Cross-Encoder</text>
  <text x="850" y="470" font-size="11" text-anchor="middle" fill="#2e7d32">Final Scoring</text>
  
  <!-- Data Layer -->
  <rect x="50" y="540" width="900" height="120" rx="15" fill="#fce4ec" filter="url(#shadow)"/>
  <text x="500" y="570" font-size="16" font-weight="bold" text-anchor="middle" fill="#880e4f">Data Layer</text>
  
  <rect x="150" y="590" width="250" height="50" rx="8" fill="#f48fb1" stroke="#c2185b" stroke-width="2"/>
  <text x="275" y="615" font-size="13" text-anchor="middle" fill="#880e4f">ChromaDB Collection</text>
  <text x="275" y="630" font-size="11" text-anchor="middle" fill="#ad1457">Vectors + Metadata</text>
  
  <rect x="450" y="590" width="250" height="50" rx="8" fill="#f48fb1" stroke="#c2185b" stroke-width="2"/>
  <text x="575" y="615" font-size="13" text-anchor="middle" fill="#880e4f">Metadata Filters</text>
  <text x="575" y="630" font-size="11" text-anchor="middle" fill="#ad1457">$eq, $gte, $and, $or</text>
  
  <!-- Arrows -->
  <path d="M 500 180 L 500 220" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 320 L 500 360" stroke="#666" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 190 500 L 190 540" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 410 500 L 410 540" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 280 445 L 320 445" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 445 L 540 445" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 720 445 L 760 445" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>
